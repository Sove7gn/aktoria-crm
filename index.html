<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Aktoria CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: white sticky top bar (brand, owner switch, search, sync) over a tab rail; one working column below; the contact panel slides in from the right. Deliberately one light theme: white paper, black ink. */
:root{
  --bg:#FFFFFF; --ink:#0B0B0C; --ink-2:#3B3B41; --ink-3:#6B6B73; --line:#E8E8EB; --line-2:#D5D5DA; --soft:#F6F6F7; --on-ink:#FFFFFF;
  --red:#B42318; --red-soft:#FDEEEC; --green:#11703A; --green-soft:#E9F6EE; --amber:#8A5A06; --amber-soft:#FCF3E1; --blue:#1E4BAF; --blue-soft:#EDF2FC;
  --scrim:rgba(11,11,12,.30); --shadow:0 16px 48px rgba(11,11,12,.14);
  --f-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --canvas:#F5F5F2; --card-shadow:0 1px 2px rgba(11,11,12,.05);
  --out:#2353CF; --out-soft:#EAF0FD; --in:#0D8457; --in-soft:#E4F4EC; --mid:#6E36C9; --mid-soft:#F1EAFB; --home:#0B0B0C; --home-soft:#ECECE8;
  --c:var(--home); --cs:var(--home-soft);
  color-scheme:light;
}
html,body{background:var(--canvas)!important}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.sidenav{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg);border-right:1px solid var(--line);
  padding:calc(20px + env(safe-area-inset-top,0px)) 14px 18px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sidenav .brand{padding:0 10px 6px}
.nav{display:flex;flex-direction:column;gap:12px}
.nav-group{display:flex;flex-direction:column;gap:1px}
.nav-h{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c);padding:8px 10px 6px}
.nav-h i{width:8px;height:8px;border-radius:3px;background:var(--c)}
.nav-h span{font:400 11.5px/1.2 var(--f-sans);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--cs);color:var(--c)}
.nav a .count{font:12px var(--f-mono);color:var(--ink-3)}
.nav a[aria-current="page"] .count{color:var(--c)}
.nav a .count.alert{background:var(--red);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:6px;font-size:12.5px;color:var(--ink-3);padding:10px 10px 0;border-top:1px solid var(--line)}
.side-foot .row-l{display:flex;align-items:center;gap:6px}
.maincol{min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(245,245,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar .search{max-width:520px}
.topbar .menu-btn{display:none}
.menu-scrim{position:fixed;inset:0;background:var(--scrim);z-index:49}
main[data-sec="out"]{--c:var(--out);--cs:var(--out-soft)}
main[data-sec="in"]{--c:var(--in);--cs:var(--in-soft)}
main[data-sec="mid"]{--c:var(--mid);--cs:var(--mid-soft)}
main .wrap{max-width:1180px}
.panel,.post,.list,.tbl-wrap,.kpi,.pace-card,.section-card,.side,.folder,.gate{background:var(--bg);box-shadow:var(--card-shadow)}
.col{background:#EDEDE9}
.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--c)!important;background:var(--cs);padding:5px 9px;border-radius:999px}
.subtabs,.tabs{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidenav{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);z-index:50;transform:translateX(-105%);transition:transform .18s ease;box-shadow:var(--shadow)}
  .sidenav.open{transform:none}
  .topbar .menu-btn{display:inline-flex}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:14px/1.5 var(--f-sans);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--ink);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:12px 8px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:4px;white-space:nowrap}
.brand b{font-weight:700;font-size:18px;letter-spacing:-.02em}
.brand span{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-weight:500;font-size:13px;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.search{flex:1 1 220px;min-width:0;display:flex}
.search input{width:100%;border:1px solid var(--line-2);background:var(--bg);border-radius:9px;padding:7px 11px;font-size:13.5px}
.search input::placeholder{color:var(--ink-3)}
.sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);margin-left:auto;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.dot.ok{background:var(--green)} .dot.stale{background:var(--amber)} .dot.err{background:var(--red)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:8px 10px 10px;border-bottom:2px solid transparent;color:var(--ink-3);text-decoration:none;font-weight:500;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.tabs .count{font:12px var(--f-mono);color:var(--ink-3);margin-left:5px}
.tabs a{font-size:15px;padding:8px 12px 11px}
.subbar{border-top:1px solid var(--line);background:var(--soft)}
.subbar:has(.subtabs[hidden]){display:none}
.subtabs{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs .sub-lbl{font-size:12.5px;color:var(--ink-3);margin-right:8px;white-space:nowrap}
.subtabs a{padding:5px 11px;border-radius:999px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:13px;white-space:nowrap;border:1px solid transparent}
.subtabs a:hover{background:var(--bg);border-color:var(--line)}
.subtabs a[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
.subtabs a[aria-current="page"] .count{color:var(--line-2)}
.subtabs .count{font:12px var(--f-mono);color:var(--ink-3);margin-left:5px}
.eyebrow{font:500 11.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.section-card{border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;text-align:left;background:var(--bg);cursor:pointer}
.section-card:hover{border-color:var(--ink)}
.section-card h2{margin:0;font-weight:650;font-size:20px;letter-spacing:-.02em}
.section-card p{margin:2px 0 0;color:var(--ink-3);font-size:13.5px}
.section-card .figs{gap:8px 26px}
.section-card .fig b{font-size:26px;letter-spacing:-.02em}
.section-card .go{font-weight:500;font-size:13.5px;margin-top:auto}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);padding:6px 11px;border-radius:8px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1.3}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.primary:hover{background:#2a2a2e}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:default}
select.sel{border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:13px;max-width:100%}

/* page */
main .wrap{padding-block:26px 80px;display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.head h1{font-weight:650;font-size:26px;line-height:1.15;letter-spacing:-.025em;margin:0;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--ink-3);max-width:70ch;font-size:14.5px}
h2.sec{font-weight:600;font-size:16px;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:8px}
h2.sec .num{font-size:12.5px;color:var(--ink-3);font-weight:400}
.sec-wrap{display:flex;flex-direction:column;gap:10px;scroll-margin-top:120px}
.sec-hint{margin:-4px 0 0;color:var(--ink-3);font-size:13px}
.note{margin:0;color:var(--ink-3);font-size:13px;border-left:2px solid var(--line-2);padding-left:10px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--soft);color:var(--ink-2);white-space:nowrap;line-height:1.7;border:1px solid transparent}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.ink{background:var(--ink);color:var(--on-ink)}
.pill.line{background:var(--bg);border-color:var(--line-2);color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;padding:0 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--ink-2);white-space:nowrap;line-height:1.8}
.pri{font:500 12.5px/1 var(--f-mono);min-width:28px;height:24px;padding:0 5px;display:inline-grid;place-items:center;border-radius:6px;border:1px solid var(--line-2);color:var(--ink-2)}
.pri.p-hi{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.pri.p-mid{border-color:var(--ink);color:var(--ink)}

/* number tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.kpi:hover{border-color:var(--line-2);background:var(--soft)}
.kpi .lbl{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.kpi .n{font:500 30px/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .dot.red{background:var(--red)} .kpi .dot.green{background:var(--green)} .kpi .dot.blue{background:var(--blue)} .kpi .dot.amber{background:var(--amber)} .kpi .dot.ink{background:var(--ink)}

/* pace */
.pace{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.pace-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.pace-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pace-top b{font-weight:600}
.meter{height:5px;border-radius:3px;background:var(--soft);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.meter i{display:block;height:100%;background:var(--ink);border-radius:3px}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-3)}
.stats .num{color:var(--ink);font-weight:500}

/* list rows */
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:38px minmax(0,1.5fr) minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--soft)}
.who{min-width:0}
.who b{font-weight:600}
.who>div,.ctx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .sub{font-size:12.5px;color:var(--ink-3)}
.ctx{display:flex;gap:6px;align-items:center;min-width:0;font-size:13px;color:var(--ink-2)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.more{display:flex;justify-content:center;padding:10px;border-top:1px solid var(--line)}
.more.bare{border:0;padding:0}
@media (max-width:720px){
  .row{grid-template-columns:38px minmax(0,1fr)}
  .row .ctx{grid-column:2}
  .row .acts{grid-column:1/-1;justify-content:flex-start}
}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--soft);border-radius:12px;display:flex;flex-direction:column;min-height:160px}
.col.over{outline:2px dashed var(--ink);outline-offset:-2px}
.col-h{padding:11px 12px 9px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.cards{display:flex;flex-direction:column;gap:7px;padding:0 8px 8px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:7px}
.card[draggable="true"]{cursor:grab}
.card:hover{border-color:var(--line-2)}
.card.busy{opacity:.5}
.card-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.card-top .who{flex:1}
.card-meta{display:flex;flex-wrap:wrap;gap:5px}

/* tables */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:860px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg)}
th button{all:unset;cursor:pointer}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:2px solid var(--ink)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
td.wrap-text{max-width:340px}

/* card grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
@media (max-width:440px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-weight:600;font-size:17px;letter-spacing:-.015em;line-height:1.25}
.panel-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lead{margin:0;color:var(--ink-2)}
.lbl{font-size:12px;color:var(--ink-3);font-weight:500}
.figs{display:flex;flex-wrap:wrap;gap:6px 18px}
.fig{display:flex;flex-direction:column}
.fig b{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.fig span{font-size:12px;color:var(--ink-3)}
.ppl{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none}
.ppl li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:13.5px}
.ppl li .muted{font-size:12.5px}
.ppl a{font-size:12.5px;color:var(--ink-3)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 14px;margin:0;font-size:13px}
.dl dt{color:var(--ink-3)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* posts */
.post{border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.post-meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.post-meta b{color:var(--ink);font-weight:600;font-size:13.5px}
.hook{margin:0;font-weight:600;font-size:15.5px;line-height:1.4;letter-spacing:-.01em;overflow-wrap:anywhere}
.body{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}
.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.shape{font:12.5px/1.5 var(--f-mono);color:var(--ink-2);background:var(--soft);border-radius:7px;padding:7px 10px;overflow-wrap:anywhere}
.trio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.75fr);gap:12px}
.trio>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.trio .box{border:1px solid var(--line);border-radius:9px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
.trio .box.ours{border-color:var(--ink)}
.trio ul{margin:0;padding-left:16px;font-size:13px;display:flex;flex-direction:column;gap:3px}
@media (max-width:820px){.trio{grid-template-columns:minmax(0,1fr)}}

/* side by side: their post and ours */
.compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.compare{grid-template-columns:minmax(0,1fr)}}
.side{border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:11px;min-width:0;background:var(--bg)}
.side.ours{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.side-h{display:flex;flex-direction:column;gap:5px}
.side-who{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px}
.side-who b{font-size:15px}
.side-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.6;border-top:1px solid var(--line);padding-top:12px;flex:1}
.verdict{margin:0;font-weight:500;font-size:15px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar-t{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--mid);border-radius:4px}
.bar-v{color:var(--ink-3);font-size:12px;white-space:nowrap}
@media (max-width:560px){.bar-row{grid-template-columns:minmax(0,1fr) auto}.bar-t{grid-column:1/-1;order:3}}
.post.clickable{cursor:pointer;transition:border-color .12s}
.post.clickable:hover{border-color:var(--ink)}
.swaps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swaps .lbl{margin-right:4px}
.modal{position:fixed;inset:0;z-index:45;overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;

function parseCSV(t){

async function write(c,cells,label){

      S.pipeLocal[c._row]={cells:keep,at:Date.now(),name:c.Name};
      build();ok=true;toast("Saved to the sheet: "+label);
    }catch(e){toast("Couldn't save: "+(e&&e.message||e),true)}

function trackedPosts(){

  const plan=new Map(M.ours.filter(p=>safeUrl(p["Posted link"])).map(p=>[linkKey(p["Posted link"]),p]));
  const said=new Map(M.engagers.map(e=>[linkKey(e["Our post link"]),e["Our post"]]));
  const engOf=r=>["Likes","Replies","Reposts","Quotes","Bookmarks"].map(c=>num(r[c])||0).reduce((a,b)=>a+b,0);
  const out=[];
  for(const [k,hist] of by){
    hist.sort((a,b)=>a._t-b._t);
    const last=hist[hist.length-1],prev=hist.length>1?hist[hist.length-2]:null,p=plan.get(k)||null;
    const views=num(last.Views),eng=engOf(last);
    out.push({key:k,link:last["Post link"],account:last.Account,plan:p,hist,views,eng,rate:rate(eng,views),
      likes:num(last.Likes)||0,replies:num(last.Replies)||0,reposts:num(last.Reposts)||0,bookmarks:num(last.Bookmarks)||0,
      grew:prev?(views||0)-(num(prev.Views)||0):null,first:p&&p._date?p._date.getTime():hist[0]._t,
      text:p?p["Our version"]:(said.get(k)||"")});
  }
  for(const [k,p] of plan)if(!by.has(k))out.push({key:k,link:p["Posted link"],account:p.Account,plan:p,hist:[],views:num(p.Views),eng:ourEng(p),
    rate:rate(ourEng(p),num(p.Views)),likes:num(p.Likes)||0,replies:num(p.Replies)||0,reposts:num(p.Reposts)||0,bookmarks:num(p.Bookmarks)||0,
    grew:null,first:p._date?p._date.getTime():0,text:p["Our version"],pending:true});

}
